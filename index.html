<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E284D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Depreciation">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Car Depreciation</title>
<style>
:root{
  /* Bernice Car Tools family design system */
  --family-navy:#0E284D;
  --bg:#f5f5f7;
  --card:#ffffff;
  --text:#111111;
  --muted:#737373;
  --line:#dcdce0;
  --soft:#f7f7f8;
  --focus:#0E284D;
  --card-radius:24px;
  --input-radius:16px;
  --input-height:52px;
  --title-size:28px;
  --label-size:12px;
  --result-size:24px;
  --shadow:0 4px 18px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:auto;padding:18px 18px 24px}
.topbar{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:14px
}
h1{font-size:var(--title-size);line-height:1;margin:0;font-weight:800;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:26px}
.top-action{
  border:0;background:transparent;font-size:14px;font-weight:700;color:#555;padding:8px 4px;min-width:58px;min-height:44px
}
.top-action:disabled{color:#b8b8bd;cursor:default}
.card{
  background:var(--card);border-radius:var(--card-radius);padding:18px;box-shadow:var(--shadow)
}
.section{margin-bottom:12px}
label{
  display:block;font-size:var(--label-size);font-weight:700;margin-bottom:5px;color:#2d2d2f
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input{
  width:100%;height:var(--input-height);border:1px solid var(--line);border-radius:var(--input-radius);background:#fff;
  padding:0 11px;font-size:16px;color:#111;outline:none
}
select:focus,input:focus{border-color:var(--focus);box-shadow:0 0 0 2px rgba(14,40,77,.08)}
.money{position:relative}
.money span{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:16px
}
.money input{padding-left:27px}
.price-row{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;
  background:var(--soft);border:1px solid var(--line);border-radius:14px;
  padding:11px 12px;margin-top:10px
}
.price-title{
  font-size:12px;font-weight:800;color:#333;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em
}
.depre{
  text-align:right;min-width:138px
}
.depre small{
  display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:2px
}
.depre strong{
  display:block;font-size:var(--result-size);line-height:1.05;font-weight:800;white-space:nowrap;letter-spacing:-.02em
}
.compare{
  margin-top:10px;padding:11px 12px;border-radius:12px;background:#efeff2;
  font-size:14px;font-weight:700;text-align:center
}
.error{color:#b00020;font-size:12px;min-height:16px;margin-top:7px}

.note{
  text-align:center;color:var(--muted);font-size:10px;line-height:1.3;margin-top:8px
}
@media(max-width:390px){
  .price-row{grid-template-columns:1fr}
  .depre{text-align:left;min-width:0}
  .depre small{display:inline;margin-right:5px}
  .depre strong{display:inline;font-size:23px}
  h1{font-size:19px}
  .top-actions{gap:18px}
  .top-action{font-size:13px;min-width:44px;padding-left:2px;padding-right:2px}
}


.brand-footer{
  text-align:center;
  color:#8a8a90;
  font-size:11px;
  font-weight:600;
  margin-top:10px;
  padding-bottom:2px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Car Depreciation</h1>
    <div class="top-actions">
      <button class="top-action" id="shareBtn" disabled>Share</button>
      <button class="top-action" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="card">
    <div class="section">
      <label>Registration Date</label>
      <div class="grid2">
        <select id="regMonth"></select>
        <select id="regYear"></select>
      </div>
    </div>

    <div class="section">
      <label>Handover Date</label>
      <div class="grid2">
        <select id="handMonth"></select>
        <select id="handYear"></select>
      </div>
    </div>

    <div class="section">
      <label>PARF</label>
      <div class="money">
        <span>$</span>
        <input id="parf" type="text" inputmode="numeric" placeholder="0">
      </div>
    </div>

    <div class="price-row">
      <div>
        <div class="price-title">Price 1</div>
        <div class="money">
          <span>$</span>
          <input id="price1" type="text" inputmode="numeric" placeholder="0">
        </div>
      </div>
      <div class="depre">
        <small>Depreciation</small>
        <strong id="dep1">$0/yr</strong>
      </div>
    </div>

    <div class="price-row">
      <div>
        <div class="price-title">Price 2</div>
        <div class="money">
          <span>$</span>
          <input id="price2" type="text" inputmode="numeric" placeholder="0">
        </div>
      </div>
      <div class="depre">
        <small>Depreciation</small>
        <strong id="dep2">$0/yr</strong>
      </div>
    </div>

    <div class="compare" id="savingText" style="display:none"></div>

    <div class="error" id="error"></div>


    <div class="note">COE expiry is calculated as 10 years from Registration Date.</div>
  </div>
  <div class="brand-footer">Bernice Chua | @bernice.mercedes</div>
</div>

<script>
const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ids=["regMonth","regYear","handMonth","handYear","parf","price1","price2"];

function fillMonths(id){
  const e=document.getElementById(id);
  months.forEach((m,i)=>e.add(new Option(m,i+1)));
}
function fillYears(id){
  const e=document.getElementById(id);
  const y=new Date().getFullYear();
  for(let n=y+1;n>=y-10;n--)e.add(new Option(n,n));
}
["regMonth","handMonth"].forEach(fillMonths);
["regYear","handYear"].forEach(fillYears);

const now=new Date();

function idx(y,m){return Number(y)*12+Number(m)-1}
function nval(v){return Number(String(v||"").replace(/[^0-9.]/g,""))||0}
function money(n){return "$"+new Intl.NumberFormat("en-SG",{maximumFractionDigits:0}).format(Number(n)||0)}
function plainMoney(n){return new Intl.NumberFormat("en-SG",{maximumFractionDigits:0}).format(n)}
function show(id,v){
  document.getElementById(id).textContent=(v===null?"$0":money(v))+"/yr";
}
function formatInput(el){
  const n=nval(el.value);
  el.value=n?plainMoney(n):"";
}
function save(){
  const d={};
  ids.forEach(id=>d[id]=document.getElementById(id).value);
  localStorage.setItem("carDepreCompactV4",JSON.stringify(d));
}
function setDefaults(){
  regMonth.value=now.getMonth()+1;
  regYear.value=now.getFullYear();
  handMonth.value=now.getMonth()+1;
  handYear.value=now.getFullYear();
  parf.value="";price1.value="";price2.value="";
}
function load(){
  const saved=localStorage.getItem("carDepreCompactV4");
  if(saved){
    try{
      const d=JSON.parse(saved);
      ids.forEach(id=>{if(d[id]!==undefined)document.getElementById(id).value=d[id]});
      return;
    }catch(e){}
  }
  setDefaults();
}

function getCalc(){
  const r=idx(regYear.value,regMonth.value);
  const h=idx(handYear.value,handMonth.value);
  const rem=(r+120)-h;
  const p=nval(parf.value),a=nval(price1.value),b=nval(price2.value);

  if(h<r)return {error:"Handover Date cannot be before Registration Date."};
  if(rem<=0)return {error:"The vehicle has reached or passed its 10-year COE expiry."};
  if((a>0&&p>a)||(b>0&&p>b))return {error:"PARF cannot be higher than an entered price."};

  const years=rem/12;
  const d1=a>0?(a-p)/years:null;
  const d2=b>0?(b-p)/years:null;
  return {p,a,b,d1,d2,diff:(d1!==null&&d2!==null)?Math.abs(d1-d2):0};
}

function calc(){
  const c=getCalc();
  error.textContent=c.error||"";

  if(c.error){
    show("dep1",null);show("dep2",null);
    savingText.textContent="";
    savingText.style.display="none";
    shareBtn.disabled=true;
    return;
  }

  show("dep1",c.d1);show("dep2",c.d2);
  shareBtn.disabled=(c.d1===null&&c.d2===null);

  if(c.d1!==null&&c.d2!==null){
    savingText.style.display="";
    if(c.d1===c.d2){
      savingText.textContent="Same annual depreciation";
    }else if(c.d2<c.d1){
      savingText.textContent="Price 2 saves "+money(c.diff)+"/yr";
    }else{
      savingText.textContent="Price 1 saves "+money(c.diff)+"/yr";
    }
  }else{
    savingText.textContent="";
    savingText.style.display="none";
  }

  save();
}

function resultText(){
  const c=getCalc();
  if(c.error)return c.error;

  let t="Car Depreciation Comparison\n";
  t+="Registration: "+months[regMonth.value-1]+" "+regYear.value+"\n";
  t+="Handover: "+months[handMonth.value-1]+" "+handYear.value+"\n";
  t+="PARF: "+money(c.p)+"\n\n";

  if(c.a)t+="Price 1: "+money(c.a)+" | "+money(c.d1)+"/yr\n";
  if(c.b)t+="Price 2: "+money(c.b)+" | "+money(c.d2)+"/yr\n";

  if(c.d1!==null&&c.d2!==null){
    if(c.d2<c.d1)t+="\nPrice 2 saves "+money(c.diff)+"/yr";
    else if(c.d1<c.d2)t+="\nPrice 1 saves "+money(c.diff)+"/yr";
    else t+="\nSame annual depreciation";
  }
  return t;
}

function roundRect(ctx,x,y,w,h,r,fill){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill)ctx.fill();
}

const carLogoImage=new Image();
carLogoImage.src="./share-logo.png";
window.carLogoImage=carLogoImage;

function makeShareCanvas(){
  const c=getCalc();
  if(c.error)throw new Error(c.error);

  const hasP1=c.a>0;
  const hasP2=c.b>0;
  const W=1400;
  const H=hasP2 ? 1100 : 840;

  const canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");

  const navy="#0E284D", blueText="#062f69", greenText="#063d2c";
  const lightBlue="#eaf6ff", lightGreen="#edf8ec", warm="#fff4df";
  const dark="#111111", grey="#555b63", line="#c9d1d8";

  function rr(x,y,w,h,r,fill){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
  }
  function centerText(text,cx,y,font,fill){
    ctx.font=font; ctx.fillStyle=fill; ctx.textAlign="center";
    ctx.textBaseline="alphabetic"; ctx.fillText(text,cx,y);
  }
  function leftText(text,x,y,font,fill){
    ctx.font=font; ctx.fillStyle=fill; ctx.textAlign="left";
    ctx.textBaseline="alphabetic"; ctx.fillText(text,x,y);
  }

  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
  rr(22,22,W-44,H-44,34,"#ffffff");

  // Header: logo + title only. No Share/Clear controls.
  rr(22,22,W-44,174,34,navy);
  ctx.fillStyle=navy; ctx.fillRect(22,120,W-44,76);

  // Current locked-in share logo, made larger.
  if(window.carLogoImage && window.carLogoImage.complete && window.carLogoImage.naturalWidth>0){
    try{ ctx.drawImage(window.carLogoImage,54,34,140,140); }catch(e){}
  }

  ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(220,50); ctx.lineTo(220,168); ctx.stroke();
  leftText("Car Depreciation",270,137,"700 64px Arial, sans-serif","#ffffff");

  // Details row
  rr(58,216,1284,180,30,"#f4f7f9");
  const cols=[272,700,1128];
  ctx.strokeStyle=line; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(486,246); ctx.lineTo(486,365); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(914,246); ctx.lineTo(914,365); ctx.stroke();

  centerText("Registration",cols[0],278,"600 38px Arial, sans-serif",grey);
  centerText(months[regMonth.value-1]+" "+regYear.value,cols[0],352,"700 58px Arial, sans-serif",dark);
  centerText("Handover",cols[1],278,"600 38px Arial, sans-serif",grey);
  centerText(months[handMonth.value-1]+" "+handYear.value,cols[1],352,"700 58px Arial, sans-serif",dark);
  centerText("PARF",cols[2],278,"600 38px Arial, sans-serif",grey);
  centerText(money(c.p),cols[2],352,"700 58px Arial, sans-serif",dark);

  function pricePanel(y,label,price,dep,bg,accent){
    rr(58,y,1284,205,30,bg);
    ctx.strokeStyle=accent+"44"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(700,y+30); ctx.lineTo(700,y+175); ctx.stroke();

    leftText(label,115,y+68,"700 38px Arial, sans-serif",accent);
    leftText(money(price),115,y+160,"700 76px Arial, sans-serif",accent);

    leftText("Annual Depreciation",770,y+68,"600 38px Arial, sans-serif",grey);
    leftText(money(dep)+"/yr",770,y+160,"700 72px Arial, sans-serif",accent);
  }

  if(hasP1){
    pricePanel(420,"PRICE 1",c.a,c.d1,lightBlue,blueText);
  }

  if(hasP2){
    pricePanel(645,"PRICE 2",c.b,c.d2,lightGreen,greenText);

    rr(58,870,1284,136,28,warm);
    let comp="Same annual depreciation", saving="";
    if(c.d2<c.d1){comp="Price 2 saves";saving=money(c.diff)+"/yr";}
    else if(c.d1<c.d2){comp="Price 1 saves";saving=money(c.diff)+"/yr";}

    if(saving){
      centerText(comp,560,956,"700 46px Arial, sans-serif",dark);
      leftText(saving,780,962,"700 66px Arial, sans-serif","#d66a00");
    } else {
      centerText(comp,700,956,"700 46px Arial, sans-serif",dark);
    }
  }

  // Subtle personal branding footer
  centerText("Bernice Chua | @bernice.mercedes",700,H-32,
             "600 24px Arial, sans-serif","#777d84");

  return canvas;
}
shareBtn.addEventListener("click",async()=>{
  try{
    if(window.carLogoImage && !window.carLogoImage.complete){
      await new Promise((resolve)=>{
        window.carLogoImage.onload=resolve;
        window.carLogoImage.onerror=resolve;
      });
    }
    const canvas=makeShareCanvas();
    const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
    const file=new File([blob],"car-depreciation.png",{type:"image/png"});

    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:"Car Depreciation",files:[file]});
    }else{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download="car-depreciation.png";
      a.click();
    }
  }catch(e){
    if(e.name!=="AbortError")alert(e.message||"Unable to share result.");
  }
});

clearBtn.addEventListener("click",()=>{
  localStorage.removeItem("carDepreCompactV4");
  setDefaults();
  calc();
});

["parf","price1","price2"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("focus",()=>{el.value=String(nval(el.value)||"");requestAnimationFrame(()=>el.select())});
  el.addEventListener("blur",()=>{formatInput(el);calc()});
  el.addEventListener("input",calc);
});

["regMonth","regYear","handMonth","handYear"].forEach(id=>{
  document.getElementById(id).addEventListener("change",calc);
});

load();
["parf","price1","price2"].forEach(id=>formatInput(document.getElementById(id)));
calc();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}))
}
</script>
</body>
</html>
